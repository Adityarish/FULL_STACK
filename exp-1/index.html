<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>Student Admission Form</h2>

        <form id="admissionForm">
            <!-- Full Name Input -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe">
                <p id="fullNameError" class="error-message"></p>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john.doe@example.com">
                <p id="emailError" class="error-message"></p>
            </div>

            <!-- Course Selection -->
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" class="form-select">
                    <option value="">-- Please Select --</option>
                    <option value="computer_science">Computer Science</option>
                    <option value="business_administration">Business Administration</option>
                    <option value="electrical_engineering">Electrical Engineering</option>
                    <option value="arts_humanities">Arts & Humanities</option>
                </select>
                <p id="courseError" class="error-message"></p>
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div>
                <input type="checkbox" id="terms">
                <label for="terms">
                    I agree to the <a href="#">terms and conditions</a>
                </label>
                <p id="termsError" class="error-message" style="margin-left: 8px;"></p>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="submit-button">
                    Submit Admission
                </button>
            </div>
        </form>
        <!-- Success Message -->
        <div id="success-message" class="hidden">
            <p>Form submitted successfully! We'll be in touch soon.</p>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
