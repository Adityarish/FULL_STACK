<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>Student Admission Form</h2>

        <form id="admissionForm">
            <!-- Full Name Input -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john.doe@example.com" required>
            </div>

            <!-- Course Selection -->
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" class="form-select" required>
                    <option value="">-- Please Select --</option>
                    <option value="computer_science">Computer Science</option>
                    <option value="business_administration">Business Administration</option>
                    <option value="electrical_engineering">Electrical Engineering</option>
                    <option value="arts_humanities">Arts & Humanities</option>
                </select>
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div>
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the <a href="#">terms and conditions</a>
                </label>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="submit-button">
                    Submit Admission
                </button>
            </div>
        </form>
        <!-- Success Message -->
        <div id="success-message" class="hidden">
            <p>Form submitted successfully! We'll be in touch soon.</p>
        </div>
        <script src="script.js?v=2"></script>
    </div>
</body>
</html>
