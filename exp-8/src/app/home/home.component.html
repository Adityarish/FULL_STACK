<div class="container">

  <h1>🎬 Movie Review System</h1>

  <div class="form-box">

    <h2>Add Movie Review</h2>

    <input
      type="text"
      placeholder="Movie Name"
      [(ngModel)]="name"
      required>

    <input
      type="number"
      placeholder="Rating (1-5)"
      [(ngModel)]="rating"
      min="1"
      max="5">

    <textarea
      placeholder="Write your review"
      [(ngModel)]="review">
    </textarea>

    <button (click)="addReview()">
      Add Review
    </button>

  </div>

  <h2 class="review-title">Movie Reviews</h2>

  <div class="reviews">

    <app-movie-card
      *ngFor="let movie of movies"
      [movie]="movie">
    </app-movie-card>

  </div>

</div>
